<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザ編集</title>
    <!-- Bootstrap 5 の読み込み -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="card-title mb-4">ユーザー情報の変更</h3>

            <!-- ユーザー編集フォーム -->
            <form th:action="@{/user/edit}" th:object="${user}" method="post">
                
                <!-- ユーザー名入力 -->
                <div class="mb-3">
                    <label class="form-label">ユーザー名（メールなど）</label>
                    <input type="text" class="form-control" th:field="*{username}" required>
                    <!-- バリデーションエラー表示 -->
                    <div th:if="${#fields.hasErrors('username')}" class="text-danger small mt-1" th:errors="*{username}"></div>
                </div>

                <!-- パスワード入力 -->
                <div class="mb-3">
                    <label class="form-label">新しいパスワード</label>
                    <input type="password" class="form-control" th:field="*{password}" required>
                    <!-- バリデーションエラー表示 -->
                    <div th:if="${#fields.hasErrors('password')}" class="text-danger small mt-1" th:errors="*{password}"></div>
                </div>

                <!-- ボタン：トップへ戻る／更新 -->
                <div class="d-flex justify-content-between">
                    <a href="/" class="btn btn-outline-secondary">トップページに戻る</a>
                    <button type="submit" class="btn btn-primary">更新する</button>
                </div>
            </form>

            <!-- 成功メッセージ表示 -->
            <div th:if="${success}" class="alert alert-success mt-3">
                ユーザー情報を更新しました。
            </div>
        </div>
    </div>
</div>

</body>
</html>
