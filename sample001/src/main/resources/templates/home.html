<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>トップページ - 在庫管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* カードホバー時のアニメーション効果 */
        .card-feature {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card-feature:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        .icon {
            font-size: 2.5rem;
            color: #0d6efd;
        }
    </style>
</head>
<body class="bg-light">

<!-- ログアウトボタンエリア -->
<div class="container mt-3 d-flex justify-content-end">
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-outline-danger">ログアウト</button>
    </form>
</div>

<!-- メインコンテンツ -->
<div class="container mt-5">
    <h2 class="mb-4 text-center">機能一覧</h2>
    <div class="row g-4">

        <!-- ユーザ編集カード -->
        <div class="col-md-4">
            <div class="card card-feature shadow-sm p-3">
                <div class="card-body text-center">
                    <div class="icon mb-3">👤</div> <!-- アイコン表示 -->
                    <h5 class="card-title">ユーザ編集</h5>
                    <p class="card-text">ユーザー情報を確認・変更します。</p>
                    <!-- ユーザ編集画面へのリンク -->
                    <a th:href="@{/user/edit}" class="btn btn-secondary">編集する</a>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
