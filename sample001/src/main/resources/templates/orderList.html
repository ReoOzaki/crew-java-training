<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>オーダーリスト</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light"> 
	<div class="table-responsive"> 
		<table class="table table-striped table-hover table-bordered align-middle text-center"> 
			<thead> 
				<tr> 
					<th>ID</th>
					<th>部品ID</th>
					<th>個数</th>
				    <th>納期</th>
					<th>備考</th> 
				</tr> 
			</thead> 
				<tbody id="employeeBody"> 
					<tr th:each="order : ${orders}"> 
						<td th:text="${order.id}"></td> 
						<td th:text="${order.partsId}"></td> 
						<td th:text="${order.partsCount}"></td> 
						<td th:text="${order.partsDay}"></td> 
						<td th:text="${order.partsComment}"></td> 
					</tr> 
				</tbody> 
			</table> 
		</div>

        <div class="">
            <a th:href="@{/}" class="btn btn-secondary">ホームに戻る</a>
            <a th:href="@{/orderList/add}" class="btn btn-secondary">追加する</a> 
			<a th:href="@{/orderList/edit}" class="btn btn-secondary">編集する</a>
        </div>
    </div>
</body>
</html>
