<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>オーダーリスト</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
	<div class="table-responsive">
		<table class="table table-striped table-hover table-bordered align-middle text-center">
			<thead>
				<tr>
					<th>Ordered Number</th>
					<th>Model</th>
					<th>Delivery Date</th>
					<th>Memo</th>
					<th>Ordered User</th>
					<th>Delivery Status</th>
				</tr>
			</thead>
			<tbod id="employeeBody">
				<tr th:each="val : ${orders}">
					<td th:text="${val.partsNumber}"></td>
					<td th:text="${val.partsModel}"></td>
					<td th:text="${val.deliveryDate}"></td>
					<td th:text="${val.memo}"></td>
					<td th:text="${val.orderedUser}"></td>
					<td th:text="${val.deliveryStatus}"></td>
				</tr>
			</tbody>
		</table>
	</div>
	
	<div class="">
		<a th:href="@{/}" class="btn btn-secondary">ホームに戻る</a>
		<a th:href="@{/orderList/add}" class="btn btn-secondary">追加する</a>
		<a th:href="@{/orderList/edit}" class="btn btn-secondary">編集する</a>
	</div>
</body>

</html>
