<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>オーダーリスト追加</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">オーダー追加</h3>
                        
                        <form th:action="@{/order/submit}" th:object="${order}" method="post">
                            <!-- 部品ID -->
                            <div class="mb-3">
                                <label for="partsId" class="form-label">部品ID</label>
                                <input type="text" id="partsId" name="partsId" class="form-control" th:field="*{partsId}" required>
                            </div>

                            <!-- 個数 -->
                            <div class="mb-3">
                                <label for="partsCount" class="form-label">個数</label>
                                <input type="number" id="partsCount" name="partsCount" class="form-control" th:field="*{partsCount}" min="1" required>
                            </div>

                            <!-- 納期 -->
                            <div class="mb-3">
                                <label for="partsDay" class="form-label">納期</label>
                                <input type="date" id="partsDay" name="partsDay" class="form-control" th:field="*{partsDay}">
                            </div>

                            <!-- 備考 -->
                            <div class="mb-3">
                                <label for="partsComment" class="form-label">備考</label>
                                <textarea id="partsComment" name="partsComment" class="form-control" th:field="*{partsComment}"></textarea>
                            </div>

                            <div class="d-grid mb-2">
                                <button type="submit" class="btn btn-primary">登録</button>
                            </div>
                        </form>

                        <a th:href="@{/order/list}" class="btn btn-secondary w-100">キャンセル</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
