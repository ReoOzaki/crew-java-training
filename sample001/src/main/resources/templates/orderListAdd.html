<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>オーダーリスト追加</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
	<div class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-md-6 col-lg-5">
				<div class="card shadow-sm">
					<div class="card-body">
						<h3 class="card-title text-center mb-4">オーダー追加</h3>
						<form th:action="@{/submit}" method="post">
							<div class="mb-3">
								<label for="partsNumber" class="form-label">パーツ個数</label>
								<input type="number" min="1" max="999" id="partsNumber" name="partsNumber" required>
							</div>
							<div class="mb-3">
								<label for="kataban" class="form-label">型番</label>
								<input type="text" class="form-control" id="kataban" name="kataban" required>
							</div>
							<div>
								<label for="deliveryDate" class="form-label">納品日</label>
								<input type="date" id="deliveryDate" name="deliveryDate">
							</div>
							<div class="d-grid">
								<button type="submit" class="btn btn-primary">提出</button>
							</div>
						</form>
						<a th:href="@{/orderList}" class="btn btn-secondary">キャンセル</a>
					</div>
				</div>
			</div>
		</div>
	</div>
	</div>
</body>

</html>
