<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新規登録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">新規登録</h3>

                    <!-- もしよければ、メールアドレスとパスワードをご入力ください -->
                    <form th:action="@{/register}" th:object="${user}" method="post">
                        <!-- メールアドレス入力 -->
                        <div class="mb-3">
                            <label for="username" class="form-label">メールアドレス</label>
                            <input type="email" class="form-control" id="username" th:field="*{username}" required>
                            <!-- エラーメッセージ表示（メールアドレス） -->
                            <div th:if="${#fields.hasErrors('username')}" class="form-text text-danger">
                                <span th:errors="*{username}">形式に誤りがあります</span>
                            </div>
                        </div>

                        <!-- パスワード入力 -->
                        <div class="mb-3">
                            <label for="password" class="form-label">パスワード</label>
                            <input type="password" class="form-control" id="password" th:field="*{password}" required>
                            <!-- エラーメッセージ表示（パスワード） -->
                            <div th:if="${#fields.hasErrors('password')}" class="form-text text-danger">
                                <span th:errors="*{password}">パスワードに誤りがあります</span>
                            </div>
                        </div>

                        <!-- 登録ボタン -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">登録する</button>
                        </div>
                    </form>

                    <!-- ログイン画面へのリンク -->
                    <div class="text-center mt-3">
                        <a th:href="@{/login}">ログインはこちら</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
